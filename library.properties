sentence=Pilotage de rubans LED adressables (RMT) sur ESP32, depuis une source DMX / Art-Net ou en mode manuel.
paragraph=StripLed pilote un ruban via RMT (show() non bloquant). CDmx et CArtnet recuperent les niveaux via DMX physique ou Art-Net, et StripDmx fait le lien entre une source (CSource) et plusieurs rubans avec lissage/snap/gamma. Le mode manuel (Preset, Effect, Select, ManualRender) joue couleurs fixes et effets sans source externe. esp_dmx est integre dans src/third_party, rien a installer a part.
category=Device Control
